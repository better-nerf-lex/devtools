server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"

      routes:
        - id: frontend-route
          uri: http://localhost:5173
          predicates:
            - Path=/ui/**
          filters:
            - StripPrefix=1
        - id: backend-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/**

management:
  endpoints:
    web:
      exposure:
        include: gateway
